# Default (no profile) configuration
# -------------------------------
# Keep this intentionally minimal so it does not change existing template behavior.
# Use profiles for environment-specific DB wiring:
# - test: H2 in-memory with deterministic schema + seed data
# - dev/prod: Oracle via wallet / TNS as per application.properties_template

# Common logging defaults (safe for all profiles)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
logging.level.=error
