# TEST profile (H2 in-memory)
# --------------------------
# This profile is used for unit/integration tests and requires no external DB.

# H2 datasource
spring.datasource.url=jdbc:h2:mem:poc_test_db;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate: use SQL scripts (not Hibernate DDL) so we can create a VIEW + INSTEAD OF triggers in H2
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Ensure SQL init (schema/data) runs before JPA queries/entities are used.
# Without this, tests can flake with "VW_USERS not found" depending on init ordering.
spring.jpa.defer-datasource-initialization=true

# Deterministic test schema + seed data
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/test-schema.sql
spring.sql.init.data-locations=classpath:db/test-data.sql

# Keep tests quiet by default
logging.level.org.hibernate.SQL=warn
logging.level.org.hibernate.type.descriptor.sql=warn
