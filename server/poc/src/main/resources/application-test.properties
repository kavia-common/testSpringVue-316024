# TEST profile (H2 in-memory)
# --------------------------
# This profile is used for unit/integration tests and requires no external DB.

# H2 datasource
spring.datasource.url=jdbc:h2:mem:poc_test_db;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate: auto-create schema from JPA entities for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Ensure SQL init runs AFTER Hibernate created tables (Spring Boot 2.4+)
spring.jpa.defer-datasource-initialization=true

# Deterministic seed data for tests
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/test-data.sql
# (Optional) keep schema-locations empty since Hibernate handles DDL
# spring.sql.init.schema-locations=

# Keep tests quiet by default
logging.level.org.hibernate.SQL=warn
logging.level.org.hibernate.type.descriptor.sql=warn
